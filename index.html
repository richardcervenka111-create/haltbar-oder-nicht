<script>
(function(){
// level: ok = MHD ist Orientierung, Sinne entscheiden · warn = kurz nach Datum mit Test · bad = Verbrauchsdatum, danach weg
const D=[
 ["milch","Milch (pasteurisiert)","Milk (pasteurised)","Mlieko (pasterizované)","ok","Riechen, dann kleiner Schluck. Sauer ist sauer, das riecht man sofort. Ungeöffnet oft 3–5 Tage über MHD, geöffnet 3 Tage. Sauer gewordene Milch: nicht trinken, aber für Pfannkuchenteig noch brauchbar, wenn sie nur säuerlich riecht und nicht bitter."],
 ["joghurt","Joghurt","Yoghurt","Jogurt","ok","Ungeöffnet meist 1–2 Wochen über MHD. Deckel gewölbt = weg. Wasser oben ist normal (Molke), umrühren. Schimmel oder Hefe-Geruch (wie Bier) = weg."],
 ["butter","Butter","Butter","Maslo","ok","Wochen über MHD im Kühlschrank, Monate im Gefrierer. Ranzig riecht wie alte Nüsse; dann reicht es nicht, nur die äussere Schicht abzuschneiden: weg."],
 ["hartkaese","Hartkäse (Gruyère, Sbrinz, Emmentaler)","Hard cheese","Tvrdý syr","ok","Schimmelstelle grosszügig (2 cm) wegschneiden, Rest ist gut. Weiss-trockene Kristalle sind Salz und Reifung, kein Problem. Geöffnet in Papier, nicht in Plastik."],
 ["weichkaese","Weichkäse, Frischkäse, Hüttenkäse","Soft cheese, cream cheese","Mäkký syr, tvaroh","warn","Bei Schimmel, der nicht zur Sorte gehört: ganz weg, er wächst im feuchten Käse durch. Ammoniak-Geruch bei Camembert = überreif, weg. Frischkäse geöffnet 5–7 Tage."],
 ["eier","Eier","Eggs","Vajcia","warn","Wassertest: liegt = frisch, steht = älter (roh nicht mehr, durchgegart gut), schwimmt = weg. MHD ist 28 Tage nach Legen; danach nur noch durchgegart (kein Spiegelei, kein Tiramisu). Im Kühlschrank, nicht in der Tür."],
 ["rohesfleisch","Rohes Fleisch (Rind, Schwein, Lamm)","Raw meat","Surové mäso","bad","Verbrauchsdatum, keine Toleranz. Klebrig, grau-grün, süsslich-fauliger Geruch = weg, auch vor dem Datum. Rind darf aussen dunkel sein (Sauerstoff), das ist keine Warnung. Vakuumverpackt: nach dem Öffnen 5 Minuten lüften, säuerlicher Geruch verschwindet dann; bleibt er, weg."],
 ["haehnchen","Geflügel roh","Raw poultry","Surová hydina","bad","Verbrauchsdatum, null Toleranz. Salmonellen und Campylobacter riechen nicht. Kühlkette einhalten, am Kauftag oder am Folgetag kochen, sonst einfrieren. Nie waschen (spritzt Keime durch die Küche), direkt in die Pfanne, Kerntemperatur 72 °C."],
 ["hackfleisch","Hackfleisch","Minced meat","Mleté mäso","bad","Grösste Oberfläche, schnellster Verderb. Am Kauftag verarbeiten, Verbrauchsdatum ist die absolute Grenze. Grau innen ist normal (kein Sauerstoff), grau-braun mit Geruch nicht."],
 ["fisch","Fisch roh","Raw fish","Surová ryba","bad","Riecht frischer Fisch nach Fisch, ist er nicht frisch; er riecht nach Meer oder nach nichts. Augen klar, Kiemen rot, Fleisch federt zurück. Verbrauchsdatum, keine Toleranz, am Kauftag essen."],
 ["wurst","Aufschnitt, Wurst, Schinken","Cold cuts","Údeniny, šunka","warn","Geöffnet 3–4 Tage. Schmierig, grau, milchig-glänzend oder säuerlich = weg. Geräucherte Rohwurst (Salami) hält Wochen, weisser Trockenschimmel aussen ist normal."],
 ["speck","Speck, Rohschinken","Bacon, cured ham","Slanina, sušená šunka","ok","Gepökelt und getrocknet: Wochen im Kühlschrank. Grün schimmernd ist Lichtbrechung durch Salz, kein Verderb. Erst schmierig oder ranzig = weg."],
 ["tofu","Tofu","Tofu","Tofu","warn","Geöffnet in Wasser, täglich wechseln, 3–5 Tage. Schleimig oder sauer = weg. Ungeöffnet 1–2 Wochen über MHD."],
 ["brot","Brot","Bread","Chlieb","ok","Kein Datum nötig, die Nase reicht. Schimmel: bei Brot komplett weg, die Fäden sind unsichtbar durch den ganzen Laib. Hart ist nicht kaputt: Ofen 5 Minuten mit Wasser, oder Croûtons, Paniermehl, Brotsuppe."],
 ["mehl","Mehl, Griess, Polenta","Flour","Múka","ok","Jahre über MHD, trocken gelagert. Vollkorn wird ranzig (riecht muffig-bitter). Motten: Gespinste, kleine Larven, dann weg und Schrank leeren."],
 ["reis","Reis, Teigwaren trocken","Rice, dry pasta","Ryža, sušené cestoviny","ok","Praktisch unbegrenzt. Gekochter Reis dagegen: innert 1 Stunde kühlen, max. 1 Tag im Kühlschrank (Bacillus cereus überlebt das Kochen). Beim Aufwärmen dampfend heiss."],
 ["konserven","Konserven","Canned food","Konzervy","ok","Jahre über MHD. Gewölbter Deckel, zischt beim Öffnen, Beule an der Naht: weg, ohne Probieren (Botulismus). Geöffnet umfüllen, 2–3 Tage."],
 ["ketchup","Ketchup, Senf, Mayonnaise","Ketchup, mustard, mayonnaise","Kečup, horčica, majonéza","ok","Ketchup und Senf: Monate über MHD, auch geöffnet (Säure, Salz). Mayonnaise geöffnet 1–2 Monate kühl; selbstgemachte mit rohem Ei: 1–2 Tage, weg bei Zweifel."],
 ["oel","Öl","Oil","Olej","ok","Ranzig riecht wie Wachsmalstifte oder alte Nüsse. Dann weg, es schmeckt bitter und ist nicht mehr gesund. Dunkel und kühl lagern verdoppelt die Zeit."],
 ["gewuerze","Gewürze, Kräuter getrocknet","Spices, dried herbs","Koreniny","ok","Werden nicht schlecht, nur schwach. Hand darüber reiben: kein Duft mehr = doppelte Menge oder neu kaufen."],
 ["honig","Honig, Zucker, Salz","Honey, sugar, salt","Med, cukor, soľ","ok","Unbegrenzt. Kristallisierter Honig: Glas in warmes Wasser stellen. Das MHD auf Honig ist eine gesetzliche Formalität."],
 ["kaffee","Kaffee, Tee","Coffee, tea","Káva, čaj","ok","Verliert Aroma, wird nicht schlecht. Bohnen 4 Wochen nach dem Öffnen am besten, danach flach. Tee jahrelang, nur schwächer."],
 ["schokolade","Schokolade","Chocolate","Čokoláda","ok","Weisser Belag ist Fettreif (Temperaturwechsel), kein Schimmel, essbar. Monate über MHD. Nur wenn sie muffig riecht (falsch gelagert) weg."],
 ["nuesse","Nüsse, Samen","Nuts, seeds","Orechy, semienka","warn","Ranzig = bitter, kratzig. Dann weg. Schimmlige Nüsse (Aflatoxin) ganze Packung weg, nicht aussortieren. Kühl und dunkel, im Sommer in den Kühlschrank."],
 ["tk","Tiefkühlware","Frozen food","Mrazené potraviny","ok","Bei −18 °C wird nichts giftig, nur trocken (Gefrierbrand: weisse, lederige Stellen wegschneiden). Gemüse 12 Monate, Fleisch 6–9, Fisch 3–6, dann nur Qualitätsverlust. Einmal aufgetaut: nicht wieder einfrieren, ausser gekocht."],
 ["salat","Salat, Blattgemüse","Salad leaves","Šalát, listová zelenina","ok","Welk ist nicht kaputt: 20 Minuten in eiskaltes Wasser. Schleimig, dunkle nasse Stellen, Geruch = weg. Beutelsalat geöffnet 1–2 Tage."],
 ["gemuese","Gemüse hart (Rüebli, Kabis, Sellerie, Randen)","Root vegetables","Koreňová zelenina","ok","Wochen. Weich und schrumpelig = noch kochbar (Suppe, Ofen), nur nicht mehr roh. Schimmel: bei harten Sorten grosszügig wegschneiden, bei weichen weg."],
 ["kartoffeln","Kartoffeln","Potatoes","Zemiaky","warn","Keime abbrechen, grüne Stellen dick wegschneiden (Solanin). Ganz grün oder weich und faul riechend: weg. Dunkel, kühl, nie im Kühlschrank."],
 ["tomaten","Tomaten, Beeren, weiches Obst","Tomatoes, berries, soft fruit","Paradajky, bobuľové ovocie","warn","Ein Schimmelpunkt auf einer Beere: diese weg, Rest sofort essen oder kochen. Bei ganzen Schalen mit Schimmel: ganze Schale weg. Überreife Tomaten: Sugo."],
 ["aepfel","Äpfel, Birnen, Zitrusfrüchte","Apples, pears, citrus","Jablká, hrušky, citrusy","ok","Wochen bis Monate. Runzlig ist gut für Kompott und Kuchen. Braune Fleckchen wegschneiden. Schimmel bei Zitrus: weg, wächst innen weiter."],
 ["bananen","Bananen","Bananas","Banány","ok","Braun ist reif, nicht kaputt: Bananenbrot, Smoothie, gefroren als Glace. Erst wenn es aus der Schale läuft und gärig riecht, weg."],
 ["fertigsalat","Fertigsalate, Sandwiches, Sushi","Ready meals, sandwiches, sushi","Hotové šaláty, sendviče, sushi","bad","Verbrauchsdatum, keine Toleranz, gekühlt bleiben. Sushi und alles mit rohem Fisch am Kauftag."],
 ["reste","Gekochte Reste","Cooked leftovers","Uvarené zvyšky","warn","Innert 2 Stunden in den Kühlschrank, 2–3 Tage, einmal dampfend heiss aufwärmen (nicht nur lauwarm). Reis, Teigwaren, Kartoffeln, Pilze, Spinat: 1 Tag, beim Aufwärmen durchheizen. Bei Zweifel: weg, das riecht man nicht immer."],
 ["suppe","Suppe, Sauce, Fond","Soup, sauce, stock","Polievka, omáčka, vývar","warn","Gekühlt 3 Tage, aufgekocht wieder 3 Tage, gefroren Monate. Kleine Bläschen und säuerlicher Geruch ohne Aufkochen = gärt, weg."],
 ["milchalternativ","Hafer-, Soja-, Mandeldrink","Oat, soy, almond drink","Ovsený, sójový nápoj","ok","Ungeöffnet UHT Monate über MHD. Geöffnet 5–7 Tage. Gerinnt im Kaffee = kurz vor Ende, aber noch nicht gefährlich; sauer oder gärig = weg."],
 ["saft","Fruchtsaft","Juice","Ovocná šťava","ok","Ungeöffnet lange über MHD. Geöffnet 5–7 Tage kühl. Gärt (prickelt, Alkoholgeruch, Flasche bläht): weg."],
 ["konfituere","Konfitüre","Jam","Džem","ok","Ungeöffnet Jahre. Geöffnet: bei Schimmel das ganze Glas weg, die Sporen sind im ganzen Glas, auch wenn nur oben Punkte sind. Immer sauberer Löffel."],
 ["pilze","Pilze frisch","Fresh mushrooms","Čerstvé huby","warn","3–4 Tage in Papier, nie in Plastik. Schleimig, dunkle nasse Stellen, ammoniakartig = weg. Gekochte Pilze nur 1 Tag."],
 ["babynahrung","Babynahrung","Baby food","Dojčenská výživa","bad","Datum einhalten, keine Toleranz. Geöffnete Gläschen 1 Tag, nie direkt aus dem Glas füttern und dann aufheben (Speichel)."],
 ["sprossen","Sprossen, Keimlinge","Sprouts","Klíčky","bad","Feucht und warm gezogen, ideal für Keime. Verbrauchsdatum, für Schwangere, Kleinkinder und Kranke nur gekocht."],
 ["mehlspeisen","Kuchen, Gebäck mit Creme","Cream cakes and pastries","Koláče s krémom","warn","Mit Creme, Rahm oder Ei: 2 Tage kühl. Trockener Kuchen und Guetzli: Wochen, werden nur hart."],
];

const L={
 de:{h:"Haltbar oder nicht?",desc:"Mindesthaltbarkeitsdatum ist kein Wegwerfdatum. 40 Lebensmittel, der Profi-Test aus der Küche, wann es wirklich weg muss. Kein Tracking.",logo:"Haltbar oder nicht? Logo",s:"40 Lebensmittel, der Test aus der Profiküche, und wann es wirklich weg muss. Suchen oder Kategorie wählen.",r1:"Mindestens haltbar bis (MHD)",r1s:"Ein Qualitätsversprechen des Herstellers. Danach: Schauen, riechen, probieren. Der grösste Teil ist noch gut.",r2:"Zu verbrauchen bis",r2s:"Auf Fleisch, Fisch, Geflügel, Sprossen, Fertigsalaten. Danach nicht mehr essen, auch wenn es gut riecht.",q:"Lebensmittel suchen …",ok:"Sinne entscheiden",warn:"Kurz, mit Test",bad:"Datum ist Grenze",
   foot:'Aus der Berufspraxis eines Kochs, nach den Grundsätzen der Schweizer Lebensmittelgesetzgebung (MHD vs. Verbrauchsdatum) und den Empfehlungen des BLV. Bei Zweifel gilt: weg. Schwangere, Kleinkinder, ältere und kranke Menschen: strenger. Kein Tracking. <a href="https://github.com/richardcervenka111-create/haltbar-oder-nicht">GitHub</a> · MIT'},
 en:{h:"Still good or not?",desc:"A best-before date is not a throw-away date. 40 foods, the professional kitchen test, and when it really has to go. No tracking.",logo:"Still good or not? logo",s:"40 foods, the professional kitchen test, and when it really has to go. Search or pick a category.",r1:"Best before",r1s:"A quality promise by the producer. After it: look, smell, taste. Most of it is still fine.",r2:"Use by",r2s:"On meat, fish, poultry, sprouts, ready salads. Do not eat after this date, even if it smells fine.",q:"Search food …",ok:"Senses decide",warn:"Short shelf life, test it",bad:"Date is the limit",
   foot:'From a chef’s professional practice, following Swiss food law principles (best-before vs use-by) and FSVO guidance. When in doubt, throw it out. Pregnant women, small children, the elderly and the sick: be stricter. No tracking. <a href="https://github.com/richardcervenka111-create/haltbar-oder-nicht">GitHub</a> · MIT'},
 sk:{h:"Ešte dobré alebo nie?",desc:"Dátum minimálnej trvanlivosti nie je dátum vyhodenia. 40 potravín, test z profesionálnej kuchyne a kedy to naozaj musí preč. Žiadne sledovanie.",logo:"Logo Ešte dobré alebo nie?",s:"40 potravín, test z profesionálnej kuchyne a kedy to naozaj musí preč. Hľadaj alebo vyber kategóriu.",r1:"Minimálna trvanlivosť (MHD)",r1s:"Prísľub kvality od výrobcu. Potom: pozri, ovoňaj, ochutnaj. Väčšina je ešte dobrá.",r2:"Spotrebujte do",r2s:"Na mäse, rybách, hydine, klíčkoch, hotových šalátoch. Po dátume nejesť, aj keď vonia dobre.",q:"Hľadať potravinu …",ok:"Rozhodnú zmysly",warn:"Krátko, s testom",bad:"Dátum je hranica",
   foot:'Z praxe kuchára, podľa zásad švajčiarskej potravinovej legislatívy (MHD vs. dátum spotreby) a odporúčaní BLV. Pri pochybnosti: preč. Tehotné, malé deti, starší a chorí: prísnejšie. Žiadne sledovanie. <a href="https://github.com/richardcervenka111-create/haltbar-oder-nicht">GitHub</a> · MIT'}};
const EN_TXT={"Riechen, dann kleiner Schluck. Sauer ist sauer, das riecht man sofort. Ungeöffnet oft 3–5 Tage über MHD, geöffnet 3 Tage. Sauer gewordene Milch: nicht trinken, aber für Pfannkuchenteig noch brauchbar, wenn sie nur säuerlich riecht und nicht bitter.":"Smell it, then take a small sip. Sour is sour, you'll notice straight away. Unopened, often 3–5 days past the best-before date; opened, 3 days. Milk that has turned sour: don't drink it, but it's still fine for pancake batter if it only smells sour and not bitter.","Ungeöffnet meist 1–2 Wochen über MHD. Deckel gewölbt = weg. Wasser oben ist normal (Molke), umrühren. Schimmel oder Hefe-Geruch (wie Bier) = weg.":"Unopened, usually 1–2 weeks past the best-before date. Domed lid = bin it. Water on top is normal (whey), just stir it in. Mould or a yeasty smell (like beer) = bin it.","Wochen über MHD im Kühlschrank, Monate im Gefrierer. Ranzig riecht wie alte Nüsse; dann reicht es nicht, nur die äussere Schicht abzuschneiden: weg.":"Weeks past the best-before date in the fridge, months in the freezer. Rancid smells like old nuts; at that point cutting off the outer layer isn't enough, bin it.","Schimmelstelle grosszügig (2 cm) wegschneiden, Rest ist gut. Weiss-trockene Kristalle sind Salz und Reifung, kein Problem. Geöffnet in Papier, nicht in Plastik.":"Cut away the mouldy spot generously (2 cm), the rest is fine. Dry white crystals are salt and ripening, no problem. Once opened, wrap in paper, not plastic.","Bei Schimmel, der nicht zur Sorte gehört: ganz weg, er wächst im feuchten Käse durch. Ammoniak-Geruch bei Camembert = überreif, weg. Frischkäse geöffnet 5–7 Tage.":"Mould that isn't part of the variety: bin the whole thing, it grows right through moist cheese. Camembert smelling of ammonia = overripe, bin it. Cream cheese, opened: 5–7 days.","Wassertest: liegt = frisch, steht = älter (roh nicht mehr, durchgegart gut), schwimmt = weg. MHD ist 28 Tage nach Legen; danach nur noch durchgegart (kein Spiegelei, kein Tiramisu). Im Kühlschrank, nicht in der Tür.":"Water test: lies flat = fresh, stands upright = older (no longer raw, fine cooked through), floats = bin it. The best-before date is 28 days after laying; after that only cooked through (no fried eggs, no tiramisu). In the fridge, not in the door.","Verbrauchsdatum, keine Toleranz. Klebrig, grau-grün, süsslich-fauliger Geruch = weg, auch vor dem Datum. Rind darf aussen dunkel sein (Sauerstoff), das ist keine Warnung. Vakuumverpackt: nach dem Öffnen 5 Minuten lüften, säuerlicher Geruch verschwindet dann; bleibt er, weg.":"Use-by date, no tolerance. Sticky, greyish-green, sweetish-rotten smell = bin it, even before the date. Beef may be dark on the outside (oxygen), that's not a warning sign. Vacuum-packed: let it air for 5 minutes after opening, a sour smell will then disappear; if it lingers, bin it.","Verbrauchsdatum, null Toleranz. Salmonellen und Campylobacter riechen nicht. Kühlkette einhalten, am Kauftag oder am Folgetag kochen, sonst einfrieren. Nie waschen (spritzt Keime durch die Küche), direkt in die Pfanne, Kerntemperatur 72 °C.":"Use-by date, zero tolerance. Salmonella and campylobacter have no smell. Keep it chilled, cook on the day of purchase or the next day, otherwise freeze. Never wash it (splashes germs around the kitchen), straight into the pan, core temperature 72 °C.","Grösste Oberfläche, schnellster Verderb. Am Kauftag verarbeiten, Verbrauchsdatum ist die absolute Grenze. Grau innen ist normal (kein Sauerstoff), grau-braun mit Geruch nicht.":"Largest surface area, spoils fastest. Use on the day of purchase, the use-by date is the absolute limit. Grey inside is normal (no oxygen), greyish-brown with a smell is not.","Riecht frischer Fisch nach Fisch, ist er nicht frisch; er riecht nach Meer oder nach nichts. Augen klar, Kiemen rot, Fleisch federt zurück. Verbrauchsdatum, keine Toleranz, am Kauftag essen.":"If fresh fish smells fishy, it isn't fresh; it smells of the sea or of nothing at all. Eyes clear, gills red, flesh springs back. Use-by date, no tolerance, eat on the day of purchase.","Geöffnet 3–4 Tage. Schmierig, grau, milchig-glänzend oder säuerlich = weg. Geräucherte Rohwurst (Salami) hält Wochen, weisser Trockenschimmel aussen ist normal.":"Opened: 3–4 days. Slimy, grey, milky sheen or sour = bin it. Smoked cured sausage (salami) keeps for weeks, white dry mould on the outside is normal.","Gepökelt und getrocknet: Wochen im Kühlschrank. Grün schimmernd ist Lichtbrechung durch Salz, kein Verderb. Erst schmierig oder ranzig = weg.":"Cured and dried: weeks in the fridge. A greenish shimmer is light refracting off the salt, not spoilage. Only once slimy or rancid = bin it.","Geöffnet in Wasser, täglich wechseln, 3–5 Tage. Schleimig oder sauer = weg. Ungeöffnet 1–2 Wochen über MHD.":"Once opened, keep in water, change it daily, 3–5 days. Slimy or sour = bin it. Unopened, 1–2 weeks past the best-before date.","Kein Datum nötig, die Nase reicht. Schimmel: bei Brot komplett weg, die Fäden sind unsichtbar durch den ganzen Laib. Hart ist nicht kaputt: Ofen 5 Minuten mit Wasser, oder Croûtons, Paniermehl, Brotsuppe.":"No date needed, your nose is enough. Mould: with bread, bin the whole loaf, the invisible threads run right through it. Stale isn't spoilt: 5 minutes in the oven with a splash of water, or croutons, breadcrumbs, bread soup.","Jahre über MHD, trocken gelagert. Vollkorn wird ranzig (riecht muffig-bitter). Motten: Gespinste, kleine Larven, dann weg und Schrank leeren.":"Years past the best-before date if stored dry. Wholegrain goes rancid (smells musty and bitter). Moths: webbing, small larvae, then bin it and empty the cupboard.","Praktisch unbegrenzt. Gekochter Reis dagegen: innert 1 Stunde kühlen, max. 1 Tag im Kühlschrank (Bacillus cereus überlebt das Kochen). Beim Aufwärmen dampfend heiss.":"Practically indefinite. Cooked rice, however: chill within 1 hour, max. 1 day in the fridge (Bacillus cereus survives cooking). Reheat until steaming hot.","Jahre über MHD. Gewölbter Deckel, zischt beim Öffnen, Beule an der Naht: weg, ohne Probieren (Botulismus). Geöffnet umfüllen, 2–3 Tage.":"Years past the best-before date. Domed lid, hisses when opened, dent along the seam: bin it without tasting (botulism). Once opened, decant into another container, 2–3 days.","Ketchup und Senf: Monate über MHD, auch geöffnet (Säure, Salz). Mayonnaise geöffnet 1–2 Monate kühl; selbstgemachte mit rohem Ei: 1–2 Tage, weg bei Zweifel.":"Ketchup and mustard: months past the best-before date, even opened (acid, salt). Mayonnaise, opened: 1–2 months in the fridge; home-made with raw egg: 1–2 days, bin it if in doubt.","Ranzig riecht wie Wachsmalstifte oder alte Nüsse. Dann weg, es schmeckt bitter und ist nicht mehr gesund. Dunkel und kühl lagern verdoppelt die Zeit.":"Rancid smells like wax crayons or old nuts. Then bin it, it tastes bitter and is no longer good for you. Storing it in a dark, cool place doubles its life.","Werden nicht schlecht, nur schwach. Hand darüber reiben: kein Duft mehr = doppelte Menge oder neu kaufen.":"They don't go off, just weak. Rub some in your hand: no aroma left = use double the amount or buy fresh.","Unbegrenzt. Kristallisierter Honig: Glas in warmes Wasser stellen. Das MHD auf Honig ist eine gesetzliche Formalität.":"Indefinite. Crystallised honey: stand the jar in warm water. The best-before date on honey is a legal formality.","Verliert Aroma, wird nicht schlecht. Bohnen 4 Wochen nach dem Öffnen am besten, danach flach. Tee jahrelang, nur schwächer.":"Loses aroma, doesn't go off. Beans are at their best for 4 weeks after opening, then go flat. Tea keeps for years, just gets weaker.","Weisser Belag ist Fettreif (Temperaturwechsel), kein Schimmel, essbar. Monate über MHD. Nur wenn sie muffig riecht (falsch gelagert) weg.":"A white coating is fat bloom (temperature changes), not mould, perfectly edible. Months past the best-before date. Only bin it if it smells musty (stored badly).","Ranzig = bitter, kratzig. Dann weg. Schimmlige Nüsse (Aflatoxin) ganze Packung weg, nicht aussortieren. Kühl und dunkel, im Sommer in den Kühlschrank.":"Rancid = bitter, scratchy. Then bin them. Mouldy nuts (aflatoxin): bin the whole packet, don't pick out the bad ones. Cool and dark, in the fridge in summer.","Bei −18 °C wird nichts giftig, nur trocken (Gefrierbrand: weisse, lederige Stellen wegschneiden). Gemüse 12 Monate, Fleisch 6–9, Fisch 3–6, dann nur Qualitätsverlust. Einmal aufgetaut: nicht wieder einfrieren, ausser gekocht.":"At −18 °C nothing turns toxic, only dry (freezer burn: cut away white, leathery patches). Vegetables 12 months, meat 6–9, fish 3–6, after that only a loss of quality. Once thawed: don't refreeze, unless cooked.","Welk ist nicht kaputt: 20 Minuten in eiskaltes Wasser. Schleimig, dunkle nasse Stellen, Geruch = weg. Beutelsalat geöffnet 1–2 Tage.":"Wilted isn't spoilt: 20 minutes in ice-cold water. Slimy, dark wet patches, smell = bin it. Bagged salad, opened: 1–2 days.","Wochen. Weich und schrumpelig = noch kochbar (Suppe, Ofen), nur nicht mehr roh. Schimmel: bei harten Sorten grosszügig wegschneiden, bei weichen weg.":"Weeks. Soft and wrinkly = still fine for cooking (soup, roasting), just not raw any more. Mould: on firm types cut away generously, on soft ones bin it.","Keime abbrechen, grüne Stellen dick wegschneiden (Solanin). Ganz grün oder weich und faul riechend: weg. Dunkel, kühl, nie im Kühlschrank.":"Snap off the sprouts, cut away green patches thickly (solanine). Completely green or soft and smelling rotten: bin it. Dark, cool, never in the fridge.","Ein Schimmelpunkt auf einer Beere: diese weg, Rest sofort essen oder kochen. Bei ganzen Schalen mit Schimmel: ganze Schale weg. Überreife Tomaten: Sugo.":"One spot of mould on a berry: bin that one, eat or cook the rest straight away. If a whole punnet is mouldy: bin the whole punnet. Overripe tomatoes: tomato sauce.","Wochen bis Monate. Runzlig ist gut für Kompott und Kuchen. Braune Fleckchen wegschneiden. Schimmel bei Zitrus: weg, wächst innen weiter.":"Weeks to months. Wrinkly is fine for stewed fruit and cakes. Cut out small brown spots. Mould on citrus: bin it, it keeps growing inside.","Braun ist reif, nicht kaputt: Bananenbrot, Smoothie, gefroren als Glace. Erst wenn es aus der Schale läuft und gärig riecht, weg.":"Brown is ripe, not spoilt: banana bread, smoothie, frozen as ice cream. Only bin it once it's oozing out of the skin and smells fermented.","Verbrauchsdatum, keine Toleranz, gekühlt bleiben. Sushi und alles mit rohem Fisch am Kauftag.":"Use-by date, no tolerance, keep chilled. Sushi and anything with raw fish on the day of purchase.","Innert 2 Stunden in den Kühlschrank, 2–3 Tage, einmal dampfend heiss aufwärmen (nicht nur lauwarm). Reis, Teigwaren, Kartoffeln, Pilze, Spinat: 1 Tag, beim Aufwärmen durchheizen. Bei Zweifel: weg, das riecht man nicht immer.":"Into the fridge within 2 hours, 2–3 days, reheat once until steaming hot (not just lukewarm). Rice, pasta, potatoes, mushrooms, spinach: 1 day, heat right through when reheating. If in doubt: bin it, you can't always smell it.","Gekühlt 3 Tage, aufgekocht wieder 3 Tage, gefroren Monate. Kleine Bläschen und säuerlicher Geruch ohne Aufkochen = gärt, weg.":"Chilled 3 days, boiled up again another 3 days, frozen months. Small bubbles and a sour smell without having been boiled = fermenting, bin it.","Ungeöffnet UHT Monate über MHD. Geöffnet 5–7 Tage. Gerinnt im Kaffee = kurz vor Ende, aber noch nicht gefährlich; sauer oder gärig = weg.":"Unopened UHT: months past the best-before date. Opened: 5–7 days. Curdles in coffee = nearly at the end, but not yet dangerous; sour or fermented = bin it.","Ungeöffnet lange über MHD. Geöffnet 5–7 Tage kühl. Gärt (prickelt, Alkoholgeruch, Flasche bläht): weg.":"Unopened, long past the best-before date. Opened: 5–7 days in the fridge. Fermenting (fizzy, smells of alcohol, bottle swelling): bin it.","Ungeöffnet Jahre. Geöffnet: bei Schimmel das ganze Glas weg, die Sporen sind im ganzen Glas, auch wenn nur oben Punkte sind. Immer sauberer Löffel.":"Unopened: years. Opened: if there's mould, bin the whole jar, the spores are throughout the jar even if there are only spots on top. Always use a clean spoon.","3–4 Tage in Papier, nie in Plastik. Schleimig, dunkle nasse Stellen, ammoniakartig = weg. Gekochte Pilze nur 1 Tag.":"3–4 days in paper, never in plastic. Slimy, dark wet patches, ammonia-like smell = bin them. Cooked mushrooms only 1 day.","Datum einhalten, keine Toleranz. Geöffnete Gläschen 1 Tag, nie direkt aus dem Glas füttern und dann aufheben (Speichel).":"Stick to the date, no tolerance. Opened jars 1 day, never feed straight from the jar and then keep the rest (saliva).","Feucht und warm gezogen, ideal für Keime. Verbrauchsdatum, für Schwangere, Kleinkinder und Kranke nur gekocht.":"Grown in warm, damp conditions, ideal for germs. Use-by date; for pregnant women, small children and the ill, only cooked.","Mit Creme, Rahm oder Ei: 2 Tage kühl. Trockener Kuchen und Guetzli: Wochen, werden nur hart.":"With custard, cream or egg: 2 days in the fridge. Dry cakes and biscuits: weeks, they only go hard."};
const tx=s=>(lang==="en"&&EN_TXT[s])||s;
let lang="de", cat=0, q="";
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name=x=>x[lang==="de"?1:lang==="en"?2:3];
function render(){ const T=L[lang]; document.documentElement.lang=lang; document.title=T.h; $("h").textContent=T.h; $("s").textContent=T.s; $("r1").textContent=T.r1; $("r1s").textContent=T.r1s; $("r2").textContent=T.r2; $("r2s").textContent=T.r2s; $("q").placeholder=T.q; $("foot").innerHTML=T.foot; const md=document.querySelector('meta[name="description"]'); if(md) md.content=T.desc; const lgo=document.querySelector("svg.k-logo[aria-label]"); if(lgo) lgo.setAttribute("aria-label",T.logo);
  const cs=$("cats"); cs.innerHTML=""; CATS[lang].forEach((c,i)=>{ const b=document.createElement("button"); b.textContent=c; b.setAttribute("aria-pressed",i===cat?"true":"false"); b.onclick=()=>{cat=i; render();}; cs.appendChild(b); });
  const allowed=cat===0?null:new Set(CATMAP[CATS.de[cat]]); const ql=q.trim().toLowerCase();
  $("list").innerHTML=D.filter(x=>(!allowed||allowed.has(x[0]))&&(!ql||name(x).toLowerCase().includes(ql)||x[1].toLowerCase().includes(ql))).map(x=>`<details><summary>${esc(name(x))}<span class="tag t-${x[4]}">${esc(T[x[4]])}</span></summary><div class="body"><p>${esc(tx(x[5]))}</p></div></details>`).join("")||`<p class="empty">–</p>`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false")); K.stagger($("list"),10); }
$("q").addEventListener("input",e=>{q=e.target.value; render();});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l; render();}));
render();
})();
</script>
